<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lesson Studio playground</title>
    <style>
      :root {
        --bg: #f6f5f2; --fg: #1d1b26; --muted: #5d5a6b; --line: #d6d3cc; --card: #fff; --accent: #2a6df4;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      header { padding: 14px 16px 6px; }
      h1 { margin: 0; font-size: 19px; }
      header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
      main { display: grid; gap: 14px; padding: 8px 16px 24px; max-width: 1180px; margin: 0 auto; }
      @media (min-width: 980px) { main { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; } }
      .controls { display: flex; flex-wrap: wrap; gap: 8px 12px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
      label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
      select { font: inherit; font-size: 14px; color: var(--fg); padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: #fff; min-height: 36px; }
      .stagewrap { display: flex; justify-content: center; }
      .device { width: 100%; }
      .device.phone { width: 360px; max-width: 100%; }
      aside { display: grid; gap: 10px; }
      .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
      .panel h2 { margin: 0 0 6px; font-size: 13px; text-transform: none; color: var(--muted); }
      .panel ul { margin: 0; padding-inline-start: 18px; }
      .ok { color: #0b7a3e; font-weight: 700; }
      .bad { color: #b42318; font-weight: 700; }
      #log { max-height: 160px; overflow: auto; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
      table { border-collapse: collapse; width: 100%; }
      td { padding: 2px 0; } td:last-child { text-align: end; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <header>
      <h1>Lesson Studio playground</h1>
      <p>Lesson Package v0.1 played by the on-device player. Lessons without narration play on estimated timings.</p>
    </header>
    <main>
      <section>
        <div class="controls" id="controls"></div>
        <div class="stagewrap"><div class="device" id="device"><div id="player"></div></div></div>
      </section>
      <aside>
        <div class="panel"><h2>Checks</h2><div id="report">…</div></div>
        <div class="panel"><h2>Download size (this language)</h2><div id="size">…</div></div>
        <div class="panel"><h2>Events</h2><div id="log"></div></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
